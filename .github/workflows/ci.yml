name: Dungeon Crawler CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js / Environment check
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Project Structure
        run: |
          echo "Checking repository structure..."
          if [ -f "README.md" ]; then
            echo "Main documentation found. Project structure is valid."
          else
            echo "Error: README.md not found!"
            exit 1
          fi

      - name: Run Basic Tests Placeholder
        run: |
          echo "Running basic tests verification..."
          echo "GDScript syntax and structure checks completed successfully."