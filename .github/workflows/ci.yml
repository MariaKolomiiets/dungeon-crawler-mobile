name: Dungeon Crawler CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Check Godot version
        run: godot --version

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Check GDScript syntax
        run: |
          godot --headless --path . --check-only --script res://tests/InventoryManager.Tests/InventoryLogic.gd
          godot --headless --path . --check-only --script res://tests/InventoryManager.Tests/test_add_item.gd
          godot --headless --path . --check-only --script res://tests/InventoryManager.Tests/test_inventory_limit.gd

      - name: Run T1 - Add item test
        run: godot --headless --path . --script res://tests/InventoryManager.Tests/test_add_item.gd

      - name: Run T2 - Inventory limit test
        run: godot --headless --path . --script res://tests/InventoryManager.Tests/test_inventory_limit.gd
