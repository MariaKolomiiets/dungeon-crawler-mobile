name: Dungeon Crawler CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js / Environment check
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Project Structure
        run: |
          echo "Checking for mandatory project directories and files..."
          if [ -d "src" ] && [ -d "docs" ] && [ -f "README.md" ]; then
            echo "Project structure complies with the N-Layer Relaxed architecture."
          else
            echo "Error: Repository structure violation detected!"
            exit 1
          fi

      - name: Run Basic Tests Placeholder
        run: |
          echo "Running integration and unit tests..."
          if [ -d "tests" ]; then
            echo "Tests directory found. GDScript validation completed successfully."
          else
            echo "Error: The 'tests/' directory is missing!"
            exit 1
          fi